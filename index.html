<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cory Dominguez — Resume</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="download-bar">
            <button id="download-md" title="Download Markdown">
                &#8615; MD
            </button>
            <button id="print-full" title="Print Full Resume">&#9113; PDF Full</button>
            <button id="print-one-page" title="Print One Page Resume">&#9113; PDF One Page</button>
        </div>
        <main id="resume">
            <noscript>
                <p>
                    This site requires JavaScript to render the resume. You can
                    <a href="resume.md">download the markdown file</a> directly.
                </p>
            </noscript>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script>
            let markdownText = "";

            fetch("resume.md")
                .then((res) => res.text())
                .then((md) => {
                    markdownText = md;
                    const resume = document.getElementById("resume");
                    resume.innerHTML = marked.parse(md);
                    const h3s = resume.querySelectorAll("h3");
                    for (const h3 of h3s) {
                        if (h3.textContent.includes("imgix")) {
                            h3.classList.add("page-break");
                            break;
                        }
                    }
                });

            document
                .getElementById("download-md")
                .addEventListener("click", () => {
                    const blob = new Blob([markdownText], {
                        type: "text/markdown",
                    });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "resume_cory_dominguez.md";
                    a.click();
                    URL.revokeObjectURL(url);
                });

            document.getElementById("print-full").addEventListener("click", () => {
                window.print();
            });

            document.getElementById("print-one-page").addEventListener("click", () => {
                const resume = document.getElementById("resume");
                const pageBreakEl = resume.querySelector(".page-break");
                if (!pageBreakEl) { window.print(); return; }
                const hidden = [];
                let el = pageBreakEl;
                while (el) {
                    el.style.display = "none";
                    hidden.push(el);
                    el = el.nextElementSibling;
                }
                window.print();
                hidden.forEach(h => h.style.display = "");
            });
        </script>
    </body>
</html>
