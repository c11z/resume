name: Release

on:
  push:
    branches: [main]
    paths:
      - resume.md
      - index.html
      - style.css
      - assets/**
      - scripts/**

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate PDFs
        run: ./scripts/generate_pdfs.sh

      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf resume_one_page.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate PDFs"
            git push
          fi

      - name: Extract version from resume.md
        id: version
        run: |
          version=$(grep -m1 '^version:' resume.md | sed 's/version: *//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Resume ${{ steps.version.outputs.tag }}
          files: |
            resume.md
            resume.pdf
            resume_one_page.pdf
          generate_release_notes: true

      - name: Update release assets
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.version.outputs.tag }}" resume.pdf resume_one_page.pdf --clobber
