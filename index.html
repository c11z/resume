<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cory Dominguez — Resume</title>
        <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="assets/favicon.ico" sizes="any" />
        <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
        <link rel="stylesheet" href="assets/c11z.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="download-bar">
            <button id="download-md" class="btn btn--secondary btn--sm" title="Download Markdown">
                <i data-lucide="download" class="icon icon--sm"></i> MD
            </button>
            <button id="print-full" class="btn btn--secondary btn--sm" title="Print Full Resume">
                <i data-lucide="file-stack" class="icon icon--sm"></i> PDF Full
            </button>
            <button id="print-one-page" class="btn btn--secondary btn--sm" title="Print One Page Resume">
                <i data-lucide="file-text" class="icon icon--sm"></i> PDF One Page
            </button>
        </div>
        <main id="resume">
            <noscript>
                <p>
                    This site requires JavaScript to render the resume. You can
                    <a href="resume.md">download the markdown file</a> directly.
                </p>
            </noscript>
        </main>

        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script>
            // Render the Lucide icons in the download bar (static markup).
            lucide.createIcons();

            let markdownText = "";
            let resumeVersion = "";

            // Download filename: resume_cory_dominguez[_variant][_vX.Y]
            // (version is read from resume.md's front matter, suffixed last).
            const fileName = (variant = "") =>
                `resume_cory_dominguez${variant}${resumeVersion ? `_v${resumeVersion}` : ""}`;

            // Contact-line icons. Most are Lucide (data-lucide placeholders that
            // lucide.createIcons() renders); GitHub & LinkedIn are inline brand
            // marks because Lucide dropped those. All inherit currentColor.
            const lucideIcon = (name) =>
                `<i data-lucide="${name}" class="icon icon--sm" aria-hidden="true"></i>`;
            const BRAND = {
                github:
                    '<svg viewBox="0 0 24 24" fill="currentColor" class="icon icon--sm" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.51 11.51 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222 0 1.606-.014 2.898-.014 3.293 0 .322.216.694.825.576C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>',
                linkedin:
                    '<svg viewBox="0 0 24 24" fill="currentColor" class="icon icon--sm" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/></svg>',
            };
            function iconFor(href = "") {
                if (href.startsWith("tel:")) return lucideIcon("phone");
                if (href.startsWith("mailto:")) return lucideIcon("mail");
                if (href.includes("linkedin.com")) return BRAND.linkedin;
                if (href.includes("github.com")) return BRAND.github;
                if (href.includes("calendar.")) return lucideIcon("calendar");
                return "";
            }

            fetch("resume.md")
                .then((res) => res.text())
                .then((md) => {
                    markdownText = md;
                    const fm = md.match(/^---\n([\s\S]*?)\n---\n/);
                    const v = fm && fm[1].match(/^version:\s*(.+)$/m);
                    if (v) resumeVersion = v[1].trim();
                    const stripped = md.replace(/^---\n[\s\S]*?\n---\n/, "");
                    const resume = document.getElementById("resume");
                    resume.innerHTML = marked.parse(stripped);
                    const h3s = resume.querySelectorAll("h3");
                    for (const h3 of h3s) {
                        if (h3.textContent.includes("imgix")) {
                            h3.classList.add("page-break");
                            break;
                        }
                    }

                    // Header: the paragraph after <h1> is the pronunciation, the
                    // next is the contact line. Tag them and add leading icons.
                    const h1 = resume.querySelector("h1");
                    const pron = h1 && h1.nextElementSibling;
                    if (pron && pron.tagName === "P") {
                        pron.classList.add("pronunciation");
                        pron.insertAdjacentHTML("afterbegin", lucideIcon("volume-2") + " ");
                    }
                    const contact = pron && pron.nextElementSibling;
                    if (contact && contact.tagName === "P") {
                        contact.classList.add("contact");
                        // Drop the " | " separators so items lay out as a row.
                        for (const node of [...contact.childNodes]) {
                            if (node.nodeType === Node.TEXT_NODE) node.remove();
                        }
                        for (const a of contact.querySelectorAll("a")) {
                            a.insertAdjacentHTML("afterbegin", iconFor(a.getAttribute("href")) + " ");
                        }
                    }
                    lucide.createIcons();
                });

            document
                .getElementById("download-md")
                .addEventListener("click", () => {
                    const blob = new Blob([markdownText], {
                        type: "text/markdown",
                    });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `${fileName()}.md`;
                    a.click();
                    URL.revokeObjectURL(url);
                });

            // Sets the suggested "Save as PDF" filename via document.title, then
            // restores it. The browser may still let the user rename in the dialog.
            function printWithName(name) {
                const prevTitle = document.title;
                document.title = name;
                window.print();
                document.title = prevTitle;
            }

            document.getElementById("print-full").addEventListener("click", () => {
                printWithName(fileName());
            });

            document.getElementById("print-one-page").addEventListener("click", () => {
                const resume = document.getElementById("resume");
                const pageBreakEl = resume.querySelector(".page-break");
                if (!pageBreakEl) { window.print(); return; }
                const hidden = [];
                let el = pageBreakEl;
                while (el) {
                    el.style.display = "none";
                    hidden.push(el);
                    el = el.nextElementSibling;
                }
                printWithName(fileName("_one_page"));
                hidden.forEach(h => h.style.display = "");
            });
        </script>
    </body>
</html>
